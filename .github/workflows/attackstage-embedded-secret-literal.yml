name: attackstage - embedded literal secret in workflow

# Embedded/hardcoded secret case. Uses AWS's OWN canonical EXAMPLE credentials
# (non-functional, safe to commit — the EICAR of AWS keys) so a detector fires without a
# real secret ever entering the repo. Expected report: a direct-report signal_type='secret'
# finding (Customer Verdict = Loaded Secret), kept PRODUCTION (a CI-config secret is not
# demoted), NOT a cicd_attack EXPLOITED verdict and NOT pentested. Remediation is GUIDANCE
# ONLY, human-gated (rotate + move to a secret store) — we do not auto-remediate.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    steps:
      - run: aws s3 cp ./dist s3://prod-bucket/ --recursive
