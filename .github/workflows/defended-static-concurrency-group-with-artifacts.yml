name: Defended - static concurrency group serializes releases

on:
  push:
    tags:
      - "npm-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tarball
          path: dist/
      - name: Simulated release, no real publish sink
        run: echo "release simulation only"
