name: Defended - static concurrency group serializes releases

on:
  push:
    tags:
      - "npm-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          name: release-tarball
          path: dist/
      - name: Simulated release, no real publish sink
        run: echo "release simulation only"
