name: attackstage - secret to a first-party action

# cicd_attack regression: a secret passed to a FIRST-PARTY action (actions/*) is not
# third-party supply-chain exfiltration (rule E). Even on a privileged trigger, the ATTACK
# stage must verdict DEFENDED for the supply-chain-exfiltration class.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: out
          path: dist/
          token: ${{ secrets.GITHUB_TOKEN }}
