name: attackstage - fork PR secret is read-only

# cicd_attack regression: a fork `pull_request` (not pull_request_target) runs with a
# READ-ONLY GITHUB_TOKEN and NO repo secrets, so exfiltrating secrets.GITHUB_TOKEN gains
# nothing. The native lane may flag secret authority (UNKNOWN); the ATTACK stage must
# verdict DEFENDED, not EXPLOITED (GitHub execution model, rule A). This is the golang.yaml
# over-call shape from nvidia-container-toolkit.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: ./ci/build.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
