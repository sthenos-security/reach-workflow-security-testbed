name: attackstage - reusable workflow_call only

# cicd_attack regression: `on: workflow_call` is not a trigger — trust equals the callers'
# triggers (rule D). With no attacker-reachable caller shown, the ATTACK stage must verdict
# NEEDS_HUMAN_REVIEW (name the caller-trigger fact), never EXPLOITED. This is the e2e.yaml
# over-call shape.
on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
