name: Defended - third-party action with no secret in scope

on:
  push:
    tags:
      - "container-v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build only, no push, no secret
        run: echo "build validation only; no registry credentials used"
