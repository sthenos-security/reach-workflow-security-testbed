name: Defended - third-party action with no secret in scope

on:
  push:
    tags:
      - "container-v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Build only, no push, no secret
        run: echo "build validation only; no registry credentials used"
