name: Defended - workflow dispatch is not persistence

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch an existing, already-reviewed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1
