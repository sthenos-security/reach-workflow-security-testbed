name: Fixture - Cordyceps artifact producer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-low-trust-artifact:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate attacker-influenced artifact
        run: |
          mkdir -p dist
          echo "${{ github.event.pull_request.title }}" > dist/release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-release
          path: dist/
      # Third-party action on a mutable tag — the WF-CICD-PINNING-01 canary.
      # actions/* are first-party and deliberately unflagged
      # (CICD-WORKFLOW-SECURITY.md decision 7); this is the class the rule
      # actually detects.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release.txt

