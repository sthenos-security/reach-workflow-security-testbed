name: Defended SARIF Only Token

on: pull_request_target

permissions:
  security-events: write
  contents: read

jobs:
  upload:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          sarif_file: results.sarif
